; ESP32 4-channel IR hub
; Platform is pinned to the Arduino-ESP32 2.x line (espressif32 6.x).
; IRremoteESP8266 2.8.x relies on the older ESP32 timer API; if you move to
; Arduino-ESP32 3.x, check the library's current compatibility first.

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default.csv
lib_deps =
    crankyoldgit/IRremoteESP8266@^2.8.6
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
build_flags =
    -DCORE_DEBUG_LEVEL=0
